name: rounds
description: Twelve rounds in a row (see ../round).
inputs:
  machine:
    description: Number of this machine
    required: true
  machines:
    description: Number of machines in the run
    required: true
  round-minutes:
    description: Minutes between rounds
    required: true
  snapshot-every:
    description: See ../round
    default: "0"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/round
      with:
        machine: ${{ inputs.machine }}
        machines: ${{ inputs.machines }}
        round-minutes: ${{ inputs.round-minutes }}
        snapshot-every: ${{ inputs.snapshot-every }}
