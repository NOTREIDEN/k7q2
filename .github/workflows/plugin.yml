name: plugin

# Builds the knockback plugin for a 1.8.8 test server, checks its arithmetic
# against the simulator's, tries it on such a server with two players and
# puts the jar on the branch "plugin".
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: sim/target
          key: sim-${{ hashFiles('sim/Cargo.toml', 'sim/Cargo.lock', 'sim/src/**', 'sim/tests/**') }}
      - name: Hits of the simulator to compare with
        run: cd sim && cargo run --release --example kb_dump -- ../hits.txt 20000
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Check the plugin's arithmetic against the simulator's
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out plugin/src/main/java/pvpai/plugin/Profile.java plugin/src/main/java/pvpai/plugin/Knock.java plugin/src/test/java/pvpai/plugin/KnockCheck.java
          java -cp out pvpai.plugin.KnockCheck hits.txt
      - name: Build the plugin
        run: cd plugin && mvn -B -ntp package
      - name: Look into the jar
        run: unzip -l plugin/target/kbtest.jar
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: plugin/target/kbtest.jar
      - uses: actions/cache@v4
        with:
          path: e2e-server/server.jar
          key: server-1.8.8
      - name: A 1.8.8 server to try the plugin on
        run: |
          mkdir -p e2e-server/plugins
          cd e2e-server
          agent="kbtest-ci/1.0"
          if [ ! -s server.jar ]; then
            url=$(curl -fsSL -A "$agent" https://fill.papermc.io/v3/projects/paper/versions/1.8.8/builds | jq -r 'first(.[] | .downloads."server:default".url) // empty' || true)
            if [ -n "$url" ]; then curl -fsSL -A "$agent" -o server.jar "$url" || rm -f server.jar; fi
          fi
          if [ ! -s server.jar ]; then
            curl -fsSL -A "$agent" -o server.jar https://api.papermc.io/v2/projects/paper/versions/1.8.8/builds/445/downloads/paper-1.8.8-445.jar
          fi
          ls -l server.jar
          cp ../plugin/target/kbtest.jar plugins/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Running the server takes the game's licence terms (eula.txt), as any test server does.
      - name: Two players on that server
        run: |
          cd plugin/e2e
          npm install --no-audit --no-fund
          node test.js ../../e2e-server
      - name: Put the jar on the branch "plugin"
        run: |
          blob=$(git hash-object -w plugin/target/kbtest.jar)
          tree=$(printf '100644 blob %s\tkbtest-1.8.8.jar\n' "$blob" | git mktree)
          commit=$(git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" -m "Plugin built by run $GITHUB_RUN_ID from $GITHUB_SHA")
          git push --force origin "$commit:refs/heads/plugin"
