name: train

on:
  workflow_dispatch:
    inputs:
      workers:
        description: Number of machines
        default: "20"
      minutes:
        description: Minutes each machine trains before the run ends
        default: "330"
      tag:
        description: Release that holds the shared weights
        default: stage1
      args:
        description: Extra options for train.py
        default: ""
      relaunch:
        description: Start the next run when this one ends
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: train-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - id: ids
        env:
          WORKERS: ${{ inputs.workers }}
        run: echo "ids=$(python3 -c 'import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))' "$WORKERS")" >> "$GITHUB_OUTPUT"

  train:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: sim/target
          key: sim-${{ hashFiles('sim/Cargo.toml', 'sim/src/**', 'sim/tests/**') }}
      - name: Build and test the simulator
        run: cd sim && cargo test --release && cargo build --release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install trainer dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy
      - name: Train
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.minutes }}
          WORKERS: ${{ inputs.workers }}
          TAG: ${{ inputs.tag }}
          EXTRA: ${{ inputs.args }}
          WORKER: ${{ matrix.worker }}
        run: |
          cd python
          python train.py --minutes "$MINUTES" --out "runs/w$WORKER" \
            --worker-id "$WORKER" --workers "$WORKERS" --sync-release "$TAG" $EXTRA
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-w${{ matrix.worker }}
          path: python/runs/w${{ matrix.worker }}/log.jsonl
          if-no-files-found: ignore

  relaunch:
    needs: train
    if: ${{ always() && !cancelled() && inputs.relaunch }}
    runs-on: ubuntu-latest
    steps:
      - name: Start the next run unless a STOP file exists in the repository
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.minutes }}
          WORKERS: ${{ inputs.workers }}
          TAG: ${{ inputs.tag }}
          EXTRA: ${{ inputs.args }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/contents/STOP" >/dev/null 2>&1; then
            echo "STOP file present, not starting another run"
            exit 0
          fi
          gh workflow run train.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f workers="$WORKERS" -f minutes="$MINUTES" -f tag="$TAG" -f args="$EXTRA" -f relaunch=true
