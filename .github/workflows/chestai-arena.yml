name: chestai-arena

# The Chest AI mod plays the farm in a Forge client on natural worlds of many
# seeds (hills, mountains, forests, rivers, villages, with walls, houses and
# fences put on the ways), one seed a machine, and the play of each is
# measured (see Demo). It starts on a push to the Chest AI branch whose commit
# message has "[chestai-arena]".
on:
  push:
    branches: [claude/project-thread-v5n15f]

permissions:
  contents: read

concurrency:
  group: chestai-arena-${{ contains(github.event.head_commit.message, '[chestai-arena]') && 'play' || github.run_id }}
  cancel-in-progress: true

jobs:
  play:
    if: contains(github.event.head_commit.message, '[chestai-arena]')
    strategy:
      fail-fast: false
      matrix:
        seed: [11, 22, 33, 44, 55, 66, 77, 88, 101, 202, 303, 404, 505, 606, 707, 808]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: chestai/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Play seed ${{ matrix.seed }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb x11-xserver-utils libgl1-mesa-dri libglx-mesa0 libxrandr2 libxcursor1 libxxf86vm1 libxi6 libxtst6 libxrender1 > /dev/null
          LIBGL_ALWAYS_SOFTWARE=1 timeout 1800 xvfb-run -a -s "-screen 0 854x480x24" gradle arena -Parena.seed=${{ matrix.seed }} -Parena.seconds=300 --no-daemon --stacktrace > arena.log 2>&1 || true
          grep -v -e '^\s*at ' -e '^\s*\.\.\. [0-9]* more' arena.log | grep -e ARENA -e Exception -e ERROR -e 'error:' | tail -n 80
          mkdir -p out
          cp run/arena.txt out/ 2>/dev/null || echo "seed=${{ matrix.seed }} FAILED" > out/arena.txt
          cp run/config/chestai/registro.txt out/ 2>/dev/null || true
          grep -v -e '^\s*at ' arena.log | grep -e ARENA -e Exception -e ERROR -e HURT | tail -n 400 > out/client.txt || true
          cat out/arena.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-${{ matrix.seed }}
          path: chestai/mod/out
          retention-days: 7

  summary:
    needs: play
    if: always() && contains(github.event.head_commit.message, '[chestai-arena]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: arena-*
          path: a
      - name: All seeds
        run: |
          cat a/*/arena.txt | tee all.txt
          python3 - <<'PY'
          rows = []
          for line in open("all.txt"):
              kv = dict(t.split("=", 1) for t in line.split() if "=" in t)
              if "claims" in kv:
                  rows.append(kv)
          if not rows:
              print("no seed finished")
              raise SystemExit(1)
          def tot(k):
              return sum(float(r[k]) for r in rows)
          mins = tot("secs") / 60.0
          print("seeds %d, minutes played %.1f" % (len(rows), mins))
          print("claims %d (%.2f a minute), resets %d, deaths %d, agent off %d" % (tot("claims"), tot("claims") / mins, tot("resets"), tot("deaths"), tot("offs")))
          print("stuck %.0f s, walking not facing the way %.1f%% of moving ticks" % (tot("stuck"), 100.0 * sum(float(r["side"]) * float(r["moving"]) for r in rows) / max(tot("moving"), 1)))
          print("arrows %d, potions %d (%d over 16 hp), apples %d (%d at full health), lowest health %.1f" % (tot("arrows"), tot("pots"), tot("potsHigh"), tot("apples"), tot("applesFull"), min(float(r["minHp"]) for r in rows)))
          print("no claim on seeds: %s" % [r["seed"] for r in rows if r["claims"] == "0"])
          PY
